<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntelliHomes RAG UI</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
        --accent-2: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #0f172a 35%, #111827);
        color: var(--text);
        min-height: 100vh;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      h1 {
        margin-bottom: 12px;
      }
      .subtitle {
        color: var(--muted);
        margin-bottom: 24px;
      }
      .panel {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.5);
      }
      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }
      input, button {
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        font-size: 16px;
      }
      input {
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        padding: 14px 16px;
      }
      button {
        background: linear-gradient(135deg, var(--accent), #2563eb);
        color: white;
        padding: 14px 20px;
        cursor: pointer;
        font-weight: 700;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }
      .status {
        margin-top: 14px;
        min-height: 28px;
        color: var(--muted);
      }
      .error { color: var(--danger); }
      .loading { color: var(--warning); }
      .result {
        margin-top: 24px;
        background: rgba(15, 23, 42, 0.8);
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        padding: 18px;
      }
      .answer {
        margin: 0 0 18px;
        font-size: 1.05rem;
        line-height: 1.6;
      }
      .source-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }
      .source-item {
        background: rgba(31, 41, 55, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .source-item strong {
        color: var(--accent);
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        background: rgba(34, 197, 94, 0.15);
        color: #bbf7d0;
        padding: 4px 8px;
        border-radius: 999px;
        margin-left: 6px;
      }
      @media (max-width: 640px) {
        form { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>IntelliHomes RAG Assistant</h1>
      <p class="subtitle">Ask a question about property ownership, legal docs, or due diligence.</p>

      <div class="panel">
        <form id="question-form">
          <input id="question" type="text" placeholder="What proves legal ownership?" value="What proves legal ownership?" />
          <button id="submit-btn" type="submit">Ask</button>
        </form>
        <div id="status" class="status">Ready.</div>
      </div>

      <div id="result" class="result" hidden>
        <h3>Grounded answer</h3>
        <p id="answer" class="answer"></p>
        <h4>Retrieved sources</h4>
        <ul id="sources" class="source-list"></ul>
      </div>
    </div>

    <script>
      const form = document.getElementById('question-form');
      const questionInput = document.getElementById('question');
      const submitBtn = document.getElementById('submit-btn');
      const status = document.getElementById('status');
      const resultPanel = document.getElementById('result');
      const answerEl = document.getElementById('answer');
      const sourcesEl = document.getElementById('sources');

      async function askQuestion(event) {
        event.preventDefault();
        const query = questionInput.value.trim();
        if (!query) {
          status.textContent = 'Please enter a question.';
          status.className = 'status error';
          return;
        }

        status.textContent = 'Thinking…';
        status.className = 'status loading';
        submitBtn.disabled = true;
        resultPanel.hidden = true;

        try {
          const response = await fetch('http://localhost:5000/answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query })
          });

          const data = await response.json();
          if (!response.ok || data.status === 'error') {
            throw new Error(data.message || 'Request failed.');
          }

          answerEl.textContent = data.answer || 'No answer returned.';
          sourcesEl.innerHTML = '';

          if (!data.sources || data.sources.length === 0) {
            const item = document.createElement('li');
            item.className = 'source-item';
            item.innerHTML = '<strong>No source metadata available.</strong>';
            sourcesEl.appendChild(item);
          } else {
            data.sources.forEach((source) => {
              const item = document.createElement('li');
              item.className = 'source-item';
              const sourceName = source.source || source.id || 'source';
              const chunk = source.chunk_id || source.id || 'unknown';
              const section = source.section ? ` • ${source.section}` : '';
              item.innerHTML = `
                <strong>${sourceName}</strong>
                <span class="badge">${chunk}</span>
                <div>${section}</div>
                <div>${source.text}</div>
              `;
              sourcesEl.appendChild(item);
            });
          }

          status.textContent = 'Answer ready.';
          status.className = 'status';
          resultPanel.hidden = false;
        } catch (error) {
          status.textContent = error.message || 'An error occurred.';
          status.className = 'status error';
        } finally {
          submitBtn.disabled = false;
        }
      }

      form.addEventListener('submit', askQuestion);
    </script>
  </body>
</html>
